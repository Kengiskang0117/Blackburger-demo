<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Esta línea es la que hace que la página se adapte al tamaño del celular -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Burger · Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   COLORES Y MEDIDAS (cámbialos aquí para otro cliente)
   ========================================================= */
:root{
  --fondo:#0F0F0F;
  --tarjeta:#1A1A1A;
  --tarjeta-2:#222222;
  --borde:#2B2B2B;
  --texto:#F5F1E8;
  --texto-suave:#A8A29A;
  --acento:#F2C230;        /* dorado */
  --acento-oscuro:#2A2410;
  --sobre-acento:#111111;  /* texto encima del dorado */
  --radio:18px;
  --alto-header:68px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
.display{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.03em;margin:0;line-height:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}

/* ---------- Encabezado ---------- */
.header{position:relative;z-index:30;background:rgba(15,15,15,.92);backdrop-filter:blur(10px);border-bottom:1px solid #1F1F1F}
.header-in{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;min-height:var(--alto-header)}
.header-in .buscador{order:3;flex:1 1 100%}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:0 0 auto}
.logo{width:38px;height:38px;border-radius:50%;background:var(--texto);color:var(--fondo);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:11px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.marca .display{font-size:26px;letter-spacing:.04em}
.marca .display span{color:var(--acento)}
.buscador{flex:1;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:14px;background:var(--tarjeta);border:1px solid var(--borde)}
.buscador input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:15px}
.buscador input::placeholder{color:#7D776F}
.btn-carrito{position:relative;width:46px;height:46px;border-radius:14px;border:1px solid var(--borde);background:var(--tarjeta);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--acento);color:var(--sobre-acento);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.badge[hidden]{display:none}

/* ---------- Contenido ---------- */
.contenedor{max-width:1240px;margin:0 auto;padding:0 20px}
.retiro{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--tarjeta);border:1px solid var(--borde);display:flex;align-items:center;gap:12px}
.retiro b{display:block;font-size:14px}
.retiro small{color:var(--texto-suave);font-size:12px}

.hero{margin-top:18px;display:grid;grid-template-columns:1fr;border-radius:24px;overflow:hidden;background:var(--tarjeta);border:1px solid var(--borde);cursor:pointer;text-align:left;padding:0;width:100%}
.hero .foto{height:230px}
.hero-txt{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px}
.etiqueta{align-self:flex-start;background:var(--acento);color:var(--sobre-acento);font-size:11px;font-weight:700;letter-spacing:.08em;padding:6px 10px;border-radius:999px}
.hero h1{font-size:42px}
.hero p{margin:0;color:#C9C3B8}
.hero-pie{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.precio{color:var(--acento);font-weight:700}
.btn-acento{height:46px;padding:0 20px;border-radius:999px;border:none;background:var(--acento);color:var(--sobre-acento);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-acento:disabled{opacity:.45;cursor:not-allowed}
.btn-borde{height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--acento);background:transparent;color:var(--acento);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.enviado{padding:30px 10px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.enviado .ok{width:84px;height:84px;border-radius:50%;background:var(--acento);color:var(--sobre-acento);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(242,194,48,.15)}
.enviado h3{font-size:36px}
.enviado p{margin:0;color:#C9C3B8}

/* ---------- Pestañas ---------- */
.pestanas{position:sticky;top:0;z-index:20;background:var(--fondo);border-bottom:1px solid #1F1F1F;margin-top:18px}
.pestanas-in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.pestanas-in::-webkit-scrollbar{display:none}
.pestana{flex:0 0 auto;height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:700;border:1px solid var(--borde);background:var(--tarjeta);color:#E6E0D6;transition:all .2s}
.pestana:hover{border-color:#4A4A4A}
.pestana.activa{background:var(--acento);border-color:var(--acento);color:var(--sobre-acento);box-shadow:0 0 0 3px rgba(242,194,48,.22),0 6px 18px rgba(242,194,48,.35);transform:translateY(-1px)}

/* ---------- Diseño en columnas (menú + carrito) ---------- */
.layout{display:block;padding-bottom:110px}
.carrito-lateral{display:none}

.seccion{padding-top:28px;scroll-margin-top:70px}
.seccion h2{font-size:32px}
.seccion .sub{margin:4px 0 0;color:var(--texto-suave);font-size:13px}
.subgrupo{margin:20px 0 0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acento);display:flex;align-items:center;gap:10px}
.subgrupo::after{content:"";flex:1;height:1px;background:var(--borde)}
.lista{margin-top:14px;display:grid;grid-template-columns:1fr;gap:12px}

.producto{display:flex;gap:14px;padding:12px;border-radius:var(--radio);background:var(--tarjeta);border:1px solid var(--borde);text-align:left;width:100%;transition:border-color .2s,transform .2s}
.producto:hover{border-color:#454545;transform:translateY(-2px)}
.producto .foto{flex:0 0 108px;height:108px;border-radius:14px}
.producto.chico .foto{flex-basis:78px;height:78px}
.p-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.p-nombre{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.p-tag{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--acento);border:1px solid #5A4A14;background:var(--acento-oscuro);padding:3px 7px;border-radius:999px}
.p-desc{margin:0;color:var(--texto-suave);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-pie{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.mas{width:40px;height:40px;border-radius:50%;background:var(--acento);color:var(--sobre-acento);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pendiente{color:#8C867E;font-style:italic;font-weight:500}

.foto{background:#262626;color:#77716A;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}

.vacio{padding:40px 0;text-align:center;color:var(--texto-suave)}
.pie-pagina{padding:30px 0 10px;text-align:center;color:#6E6A63;font-size:12px}

/* ---------- Barra del carrito (celular) ---------- */
.barra-carrito{position:fixed;left:16px;right:16px;bottom:16px;z-index:25;display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 10px 0 20px;border-radius:999px;background:var(--acento);color:var(--sobre-acento);border:none;box-shadow:0 10px 30px rgba(0,0,0,.55);font-weight:700;font-size:15px;transform:translateY(0);transition:transform .25s}
.barra-carrito[hidden]{display:none}
.barra-carrito .total{height:42px;padding:0 16px;border-radius:999px;background:#111;color:var(--acento);display:flex;align-items:center}

/* ---------- Ventanas (detalle y carrito en celular) ---------- */
.fondo-oscuro{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.fondo-oscuro.abierto{opacity:1;pointer-events:auto}
.panel{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:#141414;border:1px solid var(--borde);border-bottom:none;border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.panel.abierto{transform:translateY(0)}
.agarre{display:flex;justify-content:center;padding:10px 0 0}
.agarre span{width:44px;height:5px;border-radius:3px;background:#3A3A3A}
.cerrar{width:44px;height:44px;border-radius:50%;border:none;background:rgba(15,15,15,.8);color:var(--texto);display:flex;align-items:center;justify-content:center}

.detalle-foto{position:relative;margin:10px 16px 0}
.detalle-foto .foto{height:280px;border-radius:22px;font-size:12px}
.detalle-foto .cerrar{position:absolute;top:12px;right:12px}
.detalle-foto .etiqueta{position:absolute;top:14px;left:14px}
.detalle-txt{padding:20px 20px 0;display:flex;flex-direction:column;gap:10px}
.detalle-txt .fila{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.detalle-txt h3{font-size:44px}
.detalle-txt p{margin:0;color:#C9C3B8;font-size:15px;line-height:1.55}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label,.campo .lbl{font-size:13px;font-weight:700;color:#C9C3B8}
.campo input,.campo textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--borde);background:var(--tarjeta);font-size:15px;outline:none;resize:none}
.campo input{height:50px}
.campo input:focus,.campo textarea:focus{border-color:var(--acento)}
.campo input::placeholder,.campo textarea::placeholder{color:#7D776F}
.detalle-pie{padding:20px;display:flex;align-items:center;gap:12px;position:sticky;bottom:0;background:#141414}
.cantidad{display:flex;align-items:center;border:1px solid var(--borde);border-radius:999px;height:52px;flex:0 0 auto}
.cantidad button{width:46px;height:50px;border:none;background:transparent;font-size:22px}
.cantidad span{min-width:22px;text-align:center;font-weight:700}
.detalle-pie .btn-acento{flex:1;height:52px}

/* Carrito */
.carrito-cab{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 4px}
.carrito-cab h2{font-size:32px}
.carrito-cuerpo{padding:8px 20px 20px;display:flex;flex-direction:column;gap:12px}
.item-carrito{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--tarjeta);border:1px solid var(--borde)}
.item-carrito .foto{flex:0 0 64px;height:64px;border-radius:12px;font-size:9px}
.item-carrito .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.item-carrito .arriba{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.item-carrito .arriba .precio{white-space:nowrap}
.item-carrito .nota{font-size:12px;color:var(--texto-suave)}
.item-carrito .abajo{display:flex;align-items:center;justify-content:space-between}
.item-carrito .cantidad{height:38px}
.item-carrito .cantidad button{width:38px;height:36px;font-size:18px}
.quitar{border:none;background:transparent;color:var(--texto-suave);text-decoration:underline;font-size:13px;padding:8px}
.resumen{padding:14px 16px;border-radius:16px;background:var(--tarjeta);border:1px solid var(--borde);display:flex;flex-direction:column;gap:8px;font-size:14px}
.resumen .linea{display:flex;justify-content:space-between;color:#C9C3B8}
.resumen .total-linea{display:flex;justify-content:space-between;font-size:18px;font-weight:700;border-top:1px solid var(--borde);padding-top:10px;margin-top:2px}
.carrito-vacio{padding:30px 10px;text-align:center;color:var(--texto-suave)}
.opciones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opcion{height:48px;border-radius:12px;border:1px solid var(--borde);background:var(--tarjeta);color:#C9C3B8;font-weight:700;font-size:14px}
.opcion.activa{border-color:var(--acento);background:var(--acento-oscuro);color:var(--acento)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:#C9C3B8;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--acento)}
.error{color:#FF8A7A;font-size:13px;min-height:18px}
.volver{border:none;background:transparent;color:var(--texto-suave);font-size:14px;padding:8px 0;text-align:left}
.volver:hover{color:var(--texto)}

/* ---------- Pantalla de carga con el logo ---------- */
.splash{position:fixed;inset:0;z-index:100;background:var(--fondo);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .45s ease,visibility .45s}
.splash.oculto{opacity:0;visibility:hidden}
.splash.inicial{animation:sinjs .4s ease 4s forwards}
@keyframes sinjs{to{opacity:0;visibility:hidden}}
.sin-js{margin:40px 0;padding:22px;border-radius:18px;background:var(--tarjeta);border:1px solid var(--acento);text-align:center;line-height:1.6}
.splash-logo{position:relative;width:132px;height:132px}
.splash-logo .logo-grande{width:132px;height:132px;animation:latido 1.4s ease-in-out infinite}
.splash-logo::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid transparent;border-top-color:var(--acento);border-right-color:rgba(242,194,48,.35);animation:girar 1s linear infinite}
.splash-txt{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--texto-suave)}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes girar{to{transform:rotate(360deg)}}

.logo-grande{border-radius:50%;background:var(--texto);color:var(--fondo);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Bebas Neue',sans-serif;box-shadow:0 0 0 6px rgba(242,194,48,.12),0 20px 60px rgba(242,194,48,.18)}
.logo-grande img{width:100%;height:100%;object-fit:cover}

/* ---------- Lobby de bienvenida ---------- */
.lobby{position:fixed;inset:0;z-index:90;overflow-y:auto;background:radial-gradient(120% 70% at 50% 0%,#2A2410 0%,var(--fondo) 55%);display:flex;align-items:center;justify-content:center;padding:40px 20px;transition:opacity .4s,visibility .4s}
.lobby.oculto{opacity:0;visibility:hidden}
.lobby-in{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.lobby .logo-grande{width:112px;height:112px;font-size:34px;margin-bottom:6px}
.lobby h1{font-size:58px;letter-spacing:.04em}
.lobby h1 span{color:var(--acento)}
.lobby .pregunta{margin:4px 0 14px;font-size:17px;color:#C9C3B8}
.modos{width:100%;display:grid;grid-template-columns:1fr;gap:12px}
.modo{display:flex;align-items:center;gap:16px;width:100%;padding:20px;border-radius:22px;border:1px solid var(--borde);background:rgba(26,26,26,.9);text-align:left;transition:all .2s}
.modo:hover,.modo:focus-visible{border-color:var(--acento);transform:translateY(-2px);box-shadow:0 10px 30px rgba(242,194,48,.18)}
.modo-icono{flex:0 0 60px;height:60px;border-radius:18px;background:var(--acento);color:var(--sobre-acento);display:flex;align-items:center;justify-content:center}
.modo b{display:block;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:30px;letter-spacing:.03em;line-height:1}
.modo small{color:var(--texto-suave);font-size:14px}
.modo .flecha{margin-left:auto;color:var(--acento)}
.lobby .direccion{margin-top:14px;font-size:12px;color:#7D776F}
.retiro .cambiar{margin-left:auto;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--acento);background:transparent;color:var(--acento);font-weight:700;font-size:13px;flex:0 0 auto}
@media (prefers-reduced-motion:reduce){.splash-logo .logo-grande,.splash-logo::after{animation:none}}

/* Aviso "Agregado" */
.aviso{position:fixed;left:50%;bottom:92px;z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#F5F1E8;color:#111;font-weight:700;font-size:14px;padding:12px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:all .25s;white-space:nowrap}
.aviso.ver{opacity:1;transform:translate(-50%,0)}

/* =========================================================
   VISTA DE COMPUTADORA (pantallas de 900px o más)
   Esto es lo que hace que cambie entre celular y PC
   ========================================================= */
@media (min-width:900px){
  .header{position:sticky;top:0}
  .header-in{padding:14px 32px;flex-wrap:nowrap}
  .header-in .buscador{order:0;flex:1 1 auto;max-width:560px}
  .pestanas{top:var(--alto-header)}
  .seccion{scroll-margin-top:calc(var(--alto-header) + 70px)}
  .contenedor,.pestanas-in{padding-left:32px;padding-right:32px}
  .hero{grid-template-columns:1fr 1.1fr}
  .hero .foto{height:100%;min-height:380px;order:2}
  .hero-txt{padding:44px;justify-content:center;gap:14px}
  .hero h1{font-size:84px}
  .hero p{font-size:18px;max-width:440px}
  .hero .precio{font-size:26px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start;padding-bottom:40px}
  .lista{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .seccion h2{font-size:40px}
  .barra-carrito{display:none!important}
  .btn-carrito{display:none}
  .carrito-lateral{display:block;position:sticky;top:calc(var(--alto-header) + 84px);margin-top:28px;border-radius:22px;background:var(--tarjeta);border:1px solid var(--borde);max-height:calc(100vh - var(--alto-header) - 110px);overflow-y:auto}
  .carrito-lateral .carrito-cab h2{font-size:28px}
  .carrito-lateral .item-carrito{background:#202020}
  .carrito-lateral .resumen{background:#202020}
  .carrito-lateral .opcion,.carrito-lateral .campo input,.carrito-lateral .campo textarea{background:#202020}
  /* El detalle sale centrado en la PC */
  .panel.detalle{left:50%;right:auto;bottom:auto;top:50%;width:520px;max-height:88vh;border-radius:28px;border-bottom:1px solid var(--borde);transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;transition:all .25s}
  .panel.detalle.abierto{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
  .panel.detalle .agarre{display:none}
  .panel.carrito-movil{display:none}
  .aviso{bottom:32px}
  .modos{grid-template-columns:1fr 1fr}
  .modo{flex-direction:column;align-items:flex-start;padding:26px}
  .modo-icono{flex:0 0 auto;width:60px;height:60px}
  .modo .flecha{display:none}
  .lobby h1{font-size:76px}
}
@media (min-width:1200px){
  .lista{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>

<!-- ================= PANTALLA DE CARGA (logo) ================= -->
<div class="splash inicial" id="splash" role="status" aria-label="Cargando">
  <div class="splash-logo"><div class="logo-grande" id="splash-logo"></div></div>
  <div class="splash-txt">Cargando menú</div>
</div>

<!-- ================= LOBBY: ¿Para llevar o comer aquí? ================= -->
<div class="lobby oculto" id="lobby" role="dialog" aria-modal="true" aria-labelledby="lobby-titulo">
  <div class="lobby-in">
    <div class="logo-grande" id="lobby-logo"></div>
    <h1 class="display" id="lobby-titulo">BLACK <span>BURGER</span></h1>
    <p class="pregunta">¡Bienvenido! ¿Cómo quieres disfrutar hoy?</p>
    <div class="modos">
      <button class="modo" data-modo="llevar">
        <span class="modo-icono"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg></span>
        <span><b>Para llevar</b><small>Pide y pasa a buscarlo</small></span>

/* =========================================================
   2. A PARTIR DE AQUÍ ES EL FUNCIONAMIENTO
   (no hace falta tocarlo para cambiar productos)
   ========================================================= */
const $ = (s) => document.querySelector(s);
const PRODUCTOS = {};
MENU.forEach(sec => sec.grupos.forEach(g => g.items.forEach(p => { PRODUCTOS[p.id] = { ...p, chico: !!sec.chico }; })));

const ICONO_MAS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const ICONO_X = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';

function dinero(n){ return NEGOCIO.moneda + " " + Number(n).toLocaleString("en-US"); }
function esc(t){ return String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function textoPendiente(t){ return t.startsWith("[") ? `<span class="pendiente">${esc(t)}</span>` : esc(t); }
function fotoHTML(p, texto){ return p.img ? `<img src="${esc(p.img)}" alt="${esc(p.nombre)}" loading="lazy">` : esc(texto || "Foto"); }

/* ---------- Pintar el menú ---------- */
function pintarMenu(filtro = ""){
  const q = filtro.trim().toLowerCase();
  let html = "", hay = false;
  MENU.forEach(sec => {
    let cuerpo = "";
    sec.grupos.forEach(g => {
      const items = g.items.filter(p => !q || (p.nombre + " " + (p.desc || "")).toLowerCase().includes(q));
      if (!items.length) return;
      if (g.titulo) cuerpo += `<h3 class="subgrupo">${esc(g.titulo)}</h3>`;
      cuerpo += `<div class="lista">` + items.map(p => tarjeta(p, sec.chico)).join("") + `</div>`;
    });
    if (!cuerpo) return;
    hay = true;
    html += `<section class="seccion" id="${sec.id}"><h2 class="display">${esc(sec.nombre)}</h2>${sec.sub && !q ? `<p class="sub">${esc(sec.sub)}</p>` : ""}${cuerpo}</section>`;
  });
  $("#menu").innerHTML = hay ? html : `<div class="vacio">No encontramos "${esc(filtro)}". Prueba con otra palabra.</div>`;
  observarSecciones();
}

function tarjeta(p, chico){
  const precio = p.precio == null ? `<span class="pendiente">[Precio pendiente]</span>` : `<span class="precio">${dinero(p.precio)}</span>`;
  const desc = p.desc ? `<p class="p-desc">${textoPendiente(p.desc)}</p>` : "";
  const tag = p.tag ? `<span class="p-tag">${esc(p.tag)}</span>` : "";
  return `<button class="producto${chico ? " chico" : ""}" data-id="${p.id}" aria-label="Ver ${esc(p.nombre)}">
    <div class="foto">${fotoHTML(p)}</div>
    <div class="p-info">
      <div class="p-nombre">${textoPendiente(p.nombre)}${tag}</div>
      ${desc}
      <div class="p-pie">${precio}<span class="mas">${ICONO_MAS}</span></div>
    </div>
  </button>`;
}

function pintarPestanas(){
  $("#pestanas").innerHTML = MENU.map(s => `<button class="pestana" data-sec="${s.id}">${esc(s.nombre.replace(" y Chimi","").replace(" y papas",""))}</button>`).join("");
}

function pintarHero(){
  const p = PRODUCTOS[DESTACADO];
  $("#hero").innerHTML = `<div class="foto">${fotoHTML(p, "Foto grande · " + p.nombre)}</div>
    <div class="hero-txt">
      <span class="etiqueta">LA ESTRELLA DE LA CASA</span>
      <h1 class="display">${esc(p.nombre)}</h1>
      <p>${esc(p.desc)}</p>
      <div class="hero-pie"><span class="precio" style="font-size:22px">${dinero(p.precio)}</span><span class="btn-acento">${ICONO_MAS} Agregar</span></div>
    </div>`;
  $("#hero").dataset.id = p.id;
}

/* ---------- Pestañas: resaltar la sección que se está viendo ---------- */
let observador, scrollPorClic = false;
function marcarPestana(id){
  document.querySelectorAll(".pestana").forEach(b => {
    const on = b.dataset.sec === id;
    b.classList.toggle("activa", on);
    if (on) b.scrollIntoView({ inline:"center", block:"nearest", behavior:"smooth" });
  });
}
function observarSecciones(){
  if (observador) observador.disconnect();
  observador = new IntersectionObserver(entradas => {
    if (scrollPorClic) return;
    entradas.forEach(e => { if (e.isIntersecting) marcarPestana(e.target.id); });
  }, { rootMargin: "-140px 0px -65% 0px" });
  document.querySelectorAll(".seccion").forEach(s => observador.observe(s));
}
$("#pestanas").addEventListener("click", e => {
  const b = e.target.closest(".pestana"); if (!b) return;
  const sec = document.getElementById(b.dataset.sec);
  if (!sec) { $("#buscar").value = ""; pintarMenu(); }
  marcarPestana(b.dataset.sec);
  scrollPorClic = true;
  document.getElementById(b.dataset.sec).scrollIntoView({ behavior:"smooth", block:"start" });
  setTimeout(() => scrollPorClic = false, 1200);
});
window.addEventListener("scroll", () => {
  if (!scrollPorClic && window.scrollY < 150) document.querySelectorAll(".pestana").forEach(b => b.classList.remove("activa"));
}, { passive:true });

/* ---------- Carrito (se guarda en el navegador) ---------- */
let carrito = [];
try { carrito = JSON.parse(localStorage.getItem("carrito-" + NEGOCIO.nombre) || "[]").filter(l => PRODUCTOS[l.id]); } catch(e) { carrito = []; }
function guardar(){ try { localStorage.setItem("carrito-" + NEGOCIO.nombre, JSON.stringify(carrito)); } catch(e) {} }
const totalArticulos = () => carrito.reduce((a, l) => a + l.cant, 0);
const totalDinero = () => carrito.reduce((a, l) => a + l.cant * PRODUCTOS[l.id].precio, 0);

function agregar(id, cant, nota){
  const linea = carrito.find(l => l.id === id && (l.nota || "") === (nota || ""));
  if (linea) linea.cant += cant; else carrito.push({ id, cant, nota: nota || "" });
  guardar(); actualizarCarrito();
  avisar(`Agregado: ${PRODUCTOS[id].nombre}${cant > 1 ? " × " + cant : ""}`);
}
function cambiarCantidad(i, d){
  carrito[i].cant += d;
  if (carrito[i].cant <= 0) carrito.splice(i, 1);
  guardar(); actualizarCarrito();
}

let vistaCarrito = "lista";   // "lista" o "datos"
let pago = "Efectivo";

function htmlCarrito(){
  if (vistaCarrito === "enviado") return `<div class="carrito-cab"><h2 class="display">Pedido enviado</h2>${cerrarBtn()}</div>

      <h3 class="display">¡Ya está en la cocina!</h3>
      <p>Mesa ${esc(ultimoEnvio.mesa)} · ${esc(ultimoEnvio.resumen)}</p>
      <p>Te lo llevamos a tu mesa en cuanto esté listo.</p>
      <button class="btn-acento" data-acc="seguir" style="height:52px;width:100%;margin-top:8px">Seguir viendo el menú</button>
    </div></div>`;
  if (!carrito.length) return `<div class="carrito-cab"><h2 class="display">Tu pedido</h2></div>
    <div class="carrito-cuerpo"><div class="carrito-vacio">Tu pedido está vacío.<br>Toca un producto para agregarlo.</div></div>`;

  if (vistaCarrito === "datos") return htmlDatos();

  const items = carrito.map((l, i) => {
    const p = PRODUCTOS[l.id];
    return `<div class="item-carrito">
      <div class="foto">${fotoHTML(p)}</div>
      <div class="info">
        <div class="arriba"><span>${esc(p.nombre)}</span><span class="precio">${dinero(p.precio * l.cant)}</span></div>
        ${l.nota ? `<div class="nota">Nota: ${esc(l.nota)}</div>` : ""}
        <div class="abajo">
          <div class="cantidad"><button data-acc="menos" data-i="${i}" aria-label="Quitar uno">−</button><span>${l.cant}</span><button data-acc="mas" data-i="${i}" aria-label="Agregar uno">+</button></div>
          <button class="quitar" data-acc="quitar" data-i="${i}">Eliminar</button>
        </div>
      </div>
    </div>`;
  }).join("");

  return `<div class="carrito-cab"><h2 class="display">Tu pedido</h2>${cerrarBtn()}</div>
    <div class="carrito-cuerpo">
      ${items}
      <div class="resumen">
        <div class="linea"><span>Artículos</span><span>${totalArticulos()}</span></div>
        <div class="linea"><span>Servicio</span><span>${modo === "local" ? "Comer aquí" : "Para llevar"}</span></div>
        <div class="total-linea"><span>Total</span><span class="precio">${dinero(totalDinero())}</span></div>
      </div>
      <button class="btn-acento" data-acc="continuar" style="height:54px;width:100%">Continuar · ${dinero(totalDinero())}</button>
    </div>`;
}

  const d = datosGuardados;
  return `<div class="carrito-cab"><h2 class="display">Tus datos</h2>${cerrarBtn()}</div>
    <div class="carrito-cuerpo">
      <button class="volver" data-acc="volver">← Volver al pedido</button>
      <div class="campo"><label for="f-nombre">Nombre y apellido</label><input id="f-nombre" type="text" placeholder="Tu nombre completo" value="${esc(d.nombre)}" autocomplete="name"></div>
      <div class="campo"><label for="f-tel">Teléfono / WhatsApp</label><input id="f-tel" type="tel" placeholder="809-000-0000" value="${esc(d.tel)}" autocomplete="tel"></div>
      <div class="campo"><span class="lbl">Método de pago</span>
        <div class="opciones" role="radiogroup" aria-label="Método de pago">
          ${["Efectivo","Tarjeta","Transferencia"].map(o => `<button class="opcion${pago === o ? " activa" : ""}" role="radio" aria-checked="${pago === o}" data-acc="pago" data-v="${o}">${o}</button>`).join("")}
        </div>
      </div>
      ${pago === "Efectivo" ? `<div class="campo"><label for="f-cambio">¿Con cuánto vas a pagar? (para tu cambio)</label><input id="f-cambio" type="text" inputmode="numeric" placeholder="${NEGOCIO.moneda} 2,000" value="${esc(d.cambio)}"></div>` : ""}
      ${modo === "local" ? `<div class="campo"><label for="f-mesa">Número de mesa</label><input id="f-mesa" type="text" inputmode="numeric" placeholder="Ej.: 5" value="${esc(d.mesa)}" ${mesaQR ? "readonly" : ""}>${mesaQR ? `<small style="color:var(--texto-suave)">Detectada por el código QR de tu mesa</small>` : ""}</div>` : ""}
      <label class="check"><input type="checkbox" id="f-comprobante" ${d.comprobante ? "checked" : ""}> Necesito comprobante fiscal</label>
      <div class="campo"><label for="f-notas">Notas para el pedido (opcional)</label><textarea id="f-notas" rows="2" placeholder="${modo === "local" ? "Ej.: traer las bebidas primero" : "Ej.: paso a buscarlo a las 7:30"}">${esc(d.notas)}</textarea></div>
      <div class="resumen"><div class="total-linea" style="border:none;padding:0;margin:0"><span>Total</span><span class="precio">${dinero(totalDinero())}</span></div></div>
      <div class="error" id="f-error" role="alert"></div>
      ${modo === "local" && NEGOCIO.panelDemo ? `<button class="btn-acento" data-acc="cocina" style="height:54px;width:100%">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 9.18 0A4 4 0 0 1 18 13.87V21H6z"/><path d="M6 17h12"/></svg>
        Enviar pedido a la cocina
      </button>` : ""}
      <button class="${modo === "local" && NEGOCIO.panelDemo ? "btn-borde" : "btn-acento"}" data-acc="enviar" style="height:54px;width:100%">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
        Enviar pedido por WhatsApp
      </button>
    </div>`;
}
function cerrarBtn(){ return `<button class="cerrar solo-movil" data-acc="cerrar" aria-label="Cerrar">${ICONO_X}</button>`; }

let datosGuardados = { nombre:"", tel:"", cambio:"", mesa:"", comprobante:false, notas:"" };
function leerDatos(raiz){
  const v = s => raiz.querySelector(s);
  if (!v("#f-nombre")) return;
  datosGuardados = {
    nombre: v("#f-nombre").value, tel: v("#f-tel").value,
    cambio: v("#f-cambio") ? v("#f-cambio").value : datosGuardados.cambio,
    mesa: v("#f-mesa") ? v("#f-mesa").value : datosGuardados.mesa,
    comprobante: v("#f-comprobante").checked, notas: v("#f-notas").value
  };
}

function actualizarCarrito(){
  const n = totalArticulos();
  $("#badge").hidden = n === 0; $("#badge").textContent = n;
  $("#barra-carrito").hidden = n === 0;
  $("#barra-texto").textContent = `${n} ${n === 1 ? "artículo" : "artículos"} · Ver pedido`;
  $("#barra-total").textContent = dinero(totalDinero());
  if (!carrito.length && vistaCarrito !== "enviado") vistaCarrito = "lista";
  [$("#carrito-lateral"), $("#carrito-movil")].forEach(el => { el.innerHTML = htmlCarrito(); });
  document.querySelectorAll("#carrito-lateral .solo-movil").forEach(b => b.remove());
}

function validar(raiz, paraCocina){
  leerDatos(raiz);
  const d = datosGuardados, err = raiz.querySelector("#f-error");
  if (d.nombre.trim().length < 2) { err.textContent = "Escribe tu nombre para el pedido."; raiz.querySelector("#f-nombre").focus(); return null; }
  if (modo === "local" && !d.mesa.trim()) { err.textContent = "Escribe el número de tu mesa."; raiz.querySelector("#f-mesa").focus(); return null; }
  if (!paraCocina && d.tel.replace(/\D/g, "").length < 10) { err.textContent = "Escribe un teléfono válido (10 dígitos)."; raiz.querySelector("#f-tel").focus(); return null; }
  err.textContent = "";
  return d;
}

/* Envía el pedido al Panel de mesas (DEMO: funciona en el mismo dispositivo/navegador).
   En la versión real, aquí se envía a una base de datos en internet (Firebase, Supabase…). */
let ultimoEnvio = { mesa:"", resumen:"" };
function enviarACocina(raiz){
  const d = validar(raiz, true); if (!d) return;
  const pedido = {
    id: Date.now().toString(36), mesa: d.mesa.trim(), nombre: d.nombre.trim(), pago, notas: d.notas.trim(),
    items: carrito.map(l => ({ nombre: PRODUCTOS[l.id].nombre, cant: l.cant, nota: l.nota, precio: PRODUCTOS[l.id].precio })),
    total: totalDinero(), creado: Date.now(), estado: "nuevo"
  };
  let lista = [];
  try { lista = JSON.parse(localStorage.getItem("panel-" + NEGOCIO.nombre) || "[]"); } catch(e) {}
  lista.push(pedido);
  try { localStorage.setItem("panel-" + NEGOCIO.nombre, JSON.stringify(lista)); } catch(e) {}
  ultimoEnvio = { mesa: pedido.mesa, resumen: `${totalArticulos()} artículos · ${dinero(pedido.total)}` };
  carrito = []; guardar(); vistaCarrito = "enviado"; actualizarCarrito();
}

function enviarPedido(raiz){
  const d = validar(raiz, false); if (!d) return;
  const lineas = carrito.map(l => {
    const p = PRODUCTOS[l.id];
    return `• ${l.cant} x ${p.nombre} — ${dinero(p.precio * l.cant)}${l.nota ? `\n   Nota: ${l.nota}` : ""}`;
  }).join("\n");
  const servicio = modo === "local" ? `para comer en el local${d.mesa.trim() ? " (mesa " + d.mesa.trim() + ")" : ""}` : "para llevar";
  let msg = `¡Hola ${NEGOCIO.nombre}! Quiero hacer este pedido ${servicio}:\n\n${lineas}\n\n*Total: ${dinero(totalDinero())}*\n\n`;
  msg += `Nombre: ${d.nombre}\nTeléfono: ${d.tel}\nPago: ${pago}`;
  if (pago === "Efectivo" && d.cambio.trim()) msg += ` (pago con ${d.cambio})`;
  if (d.comprobante) msg += `\nNecesito comprobante fiscal`;
  if (d.notas.trim()) msg += `\nNotas: ${d.notas}`;
  window.open(`https://wa.me/${NEGOCIO.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
}

function clicCarrito(e){
  const b = e.target.closest("[data-acc]"); if (!b) return;
  const raiz = e.currentTarget, i = +b.dataset.i;
  switch (b.dataset.acc) {
    case "mas": cambiarCantidad(i, 1); break;
    case "menos": cambiarCantidad(i, -1); break;
    case "quitar": cambiarCantidad(i, -carrito[i].cant); break;
    case "continuar": vistaCarrito = "datos"; actualizarCarrito(); raiz.scrollTop = 0; break;
    case "volver": vistaCarrito = "lista"; actualizarCarrito(); break;
    case "pago": pago = b.dataset.v; actualizarCarrito(); break;
    case "enviar": enviarPedido(raiz); break;
    case "cocina": enviarACocina(raiz); break;
    case "seguir": vistaCarrito = "lista"; actualizarCarrito(); cerrarTodo(); break;
    case "cerrar": cerrarTodo(); break;
  }
}
$("#carrito-lateral").addEventListener("click", clicCarrito);
function escribirDatos(e){ if (e.target.closest("#f-nombre,#f-tel,#f-cambio,#f-mesa,#f-comprobante,#f-notas")) leerDatos(e.currentTarget); }
["#carrito-lateral","#carrito-movil"].forEach(s => { $(s).addEventListener("input", escribirDatos); $(s).addEventListener("change", escribirDatos); });
$("#carrito-movil").addEventListener("click", clicCarrito);

/* ---------- Ventana de detalle ---------- */
let detalleCant = 1, ultimoFoco = null;
function abrirDetalle(id){
  const p = PRODUCTOS[id]; detalleCant = 1; ultimoFoco = document.activeElement;
  const sinPrecio = p.precio == null;
  $("#detalle").innerHTML = `
    <div class="agarre"><span></span></div>
    <div class="detalle-foto">
      <div class="foto">${fotoHTML(p, "Foto grande · " + p.nombre)}</div>
      ${p.tag ? `<span class="etiqueta">${esc(p.tag)}</span>` : ""}
      <button class="cerrar" data-acc="cerrar" aria-label="Cerrar">${ICONO_X}</button>
    </div>
    <div class="detalle-txt">
      <div class="fila"><h3 class="display" id="det-nombre">${esc(p.nombre)}</h3>${sinPrecio ? `<span class="pendiente">[Precio pendiente]</span>` : `<span class="precio" style="font-size:24px">${dinero(p.precio)}</span>`}</div>
      ${p.desc ? `<p>${textoPendiente(p.desc)}</p>` : ""}
      <div class="campo" style="margin-top:8px"><label for="det-nota">Notas para la cocina (opcional)</label><textarea id="det-nota" rows="2" placeholder="Ej.: sin cebolla, término medio…"></textarea></div>
    </div>
    <div class="detalle-pie">
      <div class="cantidad"><button data-acc="menos" aria-label="Quitar uno">−</button><span id="det-cant">1</span><button data-acc="mas" aria-label="Agregar uno">+</button></div>
      <button class="btn-acento" data-acc="agregar" id="det-agregar" ${sinPrecio ? "disabled" : ""}>${sinPrecio ? "Precio pendiente" : "Agregar · " + dinero(p.precio)}</button>
    </div>`;
  $("#detalle").dataset.id = id;
  abrir($("#detalle"));
  setTimeout(() => $("#detalle .cerrar").focus(), 50);
}
$("#detalle").addEventListener("click", e => {
  const b = e.target.closest("[data-acc]"); if (!b) return;
  const p = PRODUCTOS[$("#detalle").dataset.id];
  if (b.dataset.acc === "cerrar") return cerrarTodo();
  if (b.dataset.acc === "mas") detalleCant++;
  if (b.dataset.acc === "menos") detalleCant = Math.max(1, detalleCant - 1);
  if (b.dataset.acc === "agregar") { agregar(p.id, detalleCant, $("#det-nota").value.trim()); return cerrarTodo(); }
  $("#det-cant").textContent = detalleCant;
  if (p.precio != null) $("#det-agregar").textContent = "Agregar · " + dinero(p.precio * detalleCant);
});

/* ---------- Abrir y cerrar ventanas ---------- */
function abrir(panel){
  document.querySelectorAll(".panel.abierto").forEach(x => x.classList.remove("abierto"));
  panel.classList.add("abierto"); $("#fondo").classList.add("abierto"); $("#aviso").classList.remove("ver");
  document.body.style.overflow = "hidden";
}
function cerrarTodo(){
  document.querySelectorAll(".panel.abierto").forEach(x => x.classList.remove("abierto"));
  $("#fondo").classList.remove("abierto"); document.body.style.overflow = "";
  if (ultimoFoco && ultimoFoco.focus) ultimoFoco.focus();
}
$("#fondo").addEventListener("click", cerrarTodo);
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarTodo(); });

$("#menu").addEventListener("click", e => { const b = e.target.closest(".producto"); if (b) abrirDetalle(b.dataset.id); });
$("#hero").addEventListener("click", () => abrirDetalle($("#hero").dataset.id));
function abrirCarritoMovil(){ ultimoFoco = document.activeElement; actualizarCarrito(); abrir($("#carrito-movil")); }
$("#barra-carrito").addEventListener("click", abrirCarritoMovil);
$("#abrir-carrito").addEventListener("click", abrirCarritoMovil);

/* ---------- Buscador ---------- */
let tBusca;
$("#buscar").addEventListener("input", e => { clearTimeout(tBusca); tBusca = setTimeout(() => pintarMenu(e.target.value), 150); });

/* ---------- Aviso ---------- */
let tAviso;
function avisar(t){ const a = $("#aviso"); a.textContent = t; a.classList.add("ver"); clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove("ver"), 1800); }

/* ---------- Arranque ---------- */
document.title = NEGOCIO.nombre + " · Menú";
$("#sucursal").textContent = NEGOCIO.sucursal;
/* ---------- Logo (o iniciales si todavía no hay logo) ---------- */
function logoHTML(){ return NEGOCIO.logo ? `<img src="${esc(NEGOCIO.logo)}" alt="Logo de ${esc(NEGOCIO.nombre)}">` : `<span>${esc(NEGOCIO.iniciales)}</span>`; }
["#logo","#splash-logo","#lobby-logo"].forEach(s => $(s).innerHTML = logoHTML());
$("#splash-logo").style.fontSize = "44px";
$("#lobby-direccion").textContent = NEGOCIO.sucursal;

/* ---------- Modo: para llevar o comer aquí ---------- */
let modo = null;
try { modo = sessionStorage.getItem("modo-" + NEGOCIO.nombre); } catch(e) {}
const TEXTO_MODO = { llevar:"Para llevar · Pasa a buscarlo", local:"Comer aquí · Te lo servimos en tu mesa" };

/* QR por mesa: el enlace ...index.html?mesa=5 ya sabe que es la mesa 5 */
const mesaQR = (new URLSearchParams(location.search).get("mesa") || "").replace(/[^0-9A-Za-z-]/g, "").slice(0, 6);
if (mesaQR) {
  modo = "local"; datosGuardados.mesa = mesaQR;
  TEXTO_MODO.local = `Mesa ${mesaQR} · Te lo servimos en tu mesa`;
  try { sessionStorage.setItem("modo-" + NEGOCIO.nombre, "local"); } catch(e) {}
}

function mostrarSplash(ms, despues){
  const sp = $("#splash"); sp.classList.remove("oculto", "inicial");
  setTimeout(() => { if (despues) despues(); sp.classList.add("oculto"); }, ms);
}
function mostrarLobby(){ $("#lobby").classList.remove("oculto"); document.body.style.overflow = "hidden"; }
function elegirModo(m){
  modo = m;
  try { sessionStorage.setItem("modo-" + NEGOCIO.nombre, m); } catch(e) {}
  $("#modo-texto").textContent = TEXTO_MODO[m];
  actualizarCarrito();
  mostrarSplash(700, () => { $("#lobby").classList.add("oculto"); document.body.style.overflow = ""; window.scrollTo(0, 0); });
}
$("#lobby").addEventListener("click", e => { const b = e.target.closest(".modo"); if (b) elegirModo(b.dataset.modo); });
$("#cambiar-modo").addEventListener("click", mostrarLobby);
if (mesaQR) $("#cambiar-modo").hidden = true;   // si viene del QR de la mesa, no hace falta cambiar

/* ---------- Arranque ---------- */
pintarHero(); pintarPestanas(); pintarMenu();
if (modo) $("#modo-texto").textContent = TEXTO_MODO[modo];
actualizarCarrito();
// Al abrir la página (por ejemplo, al escanear el QR): logo cargando → lobby
mostrarSplash(1300, () => { if (!modo) mostrarLobby(); });
</script>
</body>
</html>
